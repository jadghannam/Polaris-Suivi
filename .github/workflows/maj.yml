name: Mise a jour quotidienne

on:
  schedule:
    - cron: "40 18 * * 1-5"
  workflow_dispatch:
  # Un export StockTrak ou une ligne de compte deposes depuis la page :
  # la plateforme se recalcule tout de suite, sans attendre le soir.
  push:
    branches: [main]
    paths:
      - "data/OpenPosition_*.csv"
      - "data/compte.csv"
      - "data/blocages.csv"
      - "data/vetos.csv"
      - "data/portefeuilles.json"

# Une seule mise a jour a la fois : deux passages simultanes se disputeraient
# l'ecriture de data/ et le second echouerait au push.
concurrency:
  group: maj
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer la mise a jour
        run: python -m polaris.maj

      - name: Publier les resultats
        run: |
          git config user.name  "polaris-bot"
          git config user.email "polaris-bot@users.noreply.github.com"
          git add docs/data.json data/
          git diff --staged --quiet || git commit -m "maj $(date -u +%Y-%m-%d)"
          # Un depot a pu arriver pendant le calcul : on se recale avant de
          # pousser. Il declenchera son propre passage.
          git pull --rebase origin main
          git push
